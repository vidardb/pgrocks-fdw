name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

  workflow_dispatch:

jobs:
  build_with_rocksdb:
    # Pinned rather than ubuntu-latest: RocksDB 6.11.4 does not compile with
    # gcc 13 on 24.04, where it fails on headers that no longer include
    # <cstdint> transitively. gcc 11 builds it once warnings-as-errors are off.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - run: |
          export ROCKSDB_VERSION=6.11.4
          . ./scripts/install_dependencies.sh
          . ./scripts/postgres_build.sh
          . ./scripts/rocksdb_build.sh
          . ./scripts/pgrocks_fdw_build.sh
  build_with_vidardb:
    # Same constraint as above; the engine is a RocksDB fork of the same age.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - run: |
          export VIDARDB_VERSION=1.0.0
          export ACCESS_TOKEN="${{ secrets.ACCESS_TOKEN }}"
          . ./scripts/install_dependencies.sh
          . ./scripts/postgres_build.sh
          . ./scripts/vidardb_build.sh
          . ./scripts/pgrocks_fdw_build.sh true
  build_docker_image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: make docker-image

name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

  workflow_dispatch:

jobs:
  build_and_test:
    name: build + happy path
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Pinned base rather than the runner image: trixie carries both a PGDG
    # postgresql-18 package and librocksdb-dev at 9.10. Taking both from
    # packages keeps this job to about a minute, which is what makes it usable
    # as the per-push check; build_with_rocksdb covers the from-source path
    # against a newer RocksDB.
    container: debian:trixie

    env:
      OUT_DIR: ${{ github.workspace }}/test-output
      PGHOST: /tmp
      PGUSER: postgres

    steps:
      - name: Install PostgreSQL 18 and RocksDB
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git gnupg librocksdb-dev locales
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] http://apt.postgresql.org/pub/repos/apt trixie-pgdg main" \
            > /etc/apt/sources.list.d/pgdg.list
          apt-get update -qq
          apt-get install -y --no-install-recommends postgresql-18 postgresql-server-dev-18
          sed -i 's/^# *en_US.UTF-8/en_US.UTF-8/' /etc/locale.gen
          locale-gen

      - uses: actions/checkout@v5

      - name: Report toolchain versions
        run: |
          pg_config --version
          dpkg -s librocksdb-dev | grep '^Version:'
          g++ --version | head -1

      - name: Build
        run: make

      - name: Install
        run: make install

      # If kv_fdw.so were missing or unloadable, shared_preload_libraries would
      # make the postmaster exit with FATAL, so a successful start is itself the
      # check that what we built is loadable.
      - name: Start PostgreSQL with kv_fdw preloaded
        run: |
          set -eux
          install -d -o postgres -g postgres /tmp/pgdata
          su postgres -c "/usr/lib/postgresql/18/bin/initdb -D /tmp/pgdata --auth trust -U postgres"
          {
            echo "shared_preload_libraries = 'kv_fdw'"
            echo "unix_socket_directories = '/tmp'"
          } >> /tmp/pgdata/postgresql.conf
          su postgres -c "/usr/lib/postgresql/18/bin/pg_ctl -D /tmp/pgdata -l /tmp/pg.log -w start"
          psql -c 'SELECT version()'

      # Diffs the full psql transcript of each script against expected/, so a
      # behaviour change fails the build rather than just a crash.
      - name: Run the happy path
        run: bash scripts/run_tests.sh

      - name: Collect logs
        if: failure()
        run: |
          mkdir -p "$OUT_DIR"
          cp /tmp/pg.log "$OUT_DIR/postmaster.log" 2>/dev/null || true

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: pgrocks-fdw-logs
          path: test-output/
          if-no-files-found: ignore

  build_with_rocksdb:
    # Builds PostgreSQL and RocksDB from source, so it is slow and runs
    # alongside build_and_test rather than instead of it. RocksDB 10 is a
    # newer major than the 9.10 that trixie packages, which is the point: it
    # is the only job that sees the version this is meant to move to.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - run: |
          export ROCKSDB_VERSION=10.10.1
          . ./scripts/install_dependencies.sh
          . ./scripts/postgres_build.sh
          . ./scripts/rocksdb_build.sh
          . ./scripts/pgrocks_fdw_build.sh
  build_with_vidardb:
    # Temporarily off for push and pull_request: the ACCESS_TOKEN secret no
    # longer authenticates against vidardb/vidardb-engine, so the job cannot
    # get past the clone and would fail every build for a reason unrelated to
    # the change under test. It still runs on workflow_dispatch, so it can be
    # exercised once the token is rotated; drop this condition to restore it.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    # Still pinned to 22.04: vidardb-engine is a fork of RocksDB 6.x, so it
    # keeps the constraint the other jobs have now shed, namely that code of
    # that age does not compile on a current gcc.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - run: |
          export VIDARDB_VERSION=1.0.0
          export ACCESS_TOKEN="${{ secrets.ACCESS_TOKEN }}"
          . ./scripts/install_dependencies.sh
          . ./scripts/postgres_build.sh
          . ./scripts/vidardb_build.sh
          . ./scripts/pgrocks_fdw_build.sh true
  build_docker_image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: make docker-image
